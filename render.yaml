services:
  - type: web
    name: mcp-ui-extapps-demo
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen || uv sync
    startCommand: uv run python server/server.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PUBLIC_HOSTED_BASE
        value: https://omeirhaeghe.github.io/mcp-ui-extapps-demo
      # Required by show_spamoola_news. Get one at https://newsapi.org/register
      # and set it in the Render dashboard — don't commit to the repo.
      - key: NEWSAPI_KEY
        sync: false
      # Required by show_ebay_search. Two auth modes — pick one:
      # (a) Pre-generated Application Access Token from
      #     developer.ebay.com → User Tokens → "App access token" Generate.
      #     Simpler but expires ~2h; you'll re-generate manually.
      - key: EBAY_OAUTH_TOKEN
        sync: false
      # (b) OR the full keyset, and the server runs the client-credentials
      #     OAuth exchange itself + caches the token (~2h with auto-refresh).
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      # Optional: "production" (default) or "sandbox".
      - key: EBAY_ENV
        value: production
