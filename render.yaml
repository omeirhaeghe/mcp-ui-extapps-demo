services:
  - type: web
    name: mcp-ui-extapps-demo
    runtime: python
    plan: free
    buildCommand: pip install uv && uv sync --frozen || uv sync
    startCommand: uv run python server/server.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PUBLIC_HOSTED_BASE
        value: https://omeirhaeghe.github.io/mcp-ui-extapps-demo
      # Required by show_headlines. Get one at https://newsapi.org/register and
      # set the value in the Render dashboard — don't commit it to the repo.
      - key: NEWSAPI_KEY
        sync: false
