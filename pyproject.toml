[project]
name = "mcp-ui-extapps-demo"
version = "0.1.0"
description = "Reference MCP-UI ext-apps for testing host implementations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
