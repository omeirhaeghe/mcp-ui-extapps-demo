<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Headlines — MCP App</title>
  <style>
    /* ============================================================
       Liquid Glass — frosted surfaces over an animated mesh.
       Surfaces use backdrop-filter; the body holds the color spill
       that the cards refract.
       ============================================================ */
    :root {
      color-scheme: light dark;
      /* Light theme palette */
      --fg:#0b1020;
      --muted:#5b6478;
      --bad:#e11d48;
      --accent-a:#8b5cf6;  /* violet */
      --accent-b:#06b6d4;  /* cyan   */
      --accent-c:#f43f5e;  /* rose   */
      --accent-d:#fbbf24;  /* amber  */
      /* Glass tokens */
      --glass-bg:           rgba(255,255,255,0.55);
      --glass-bg-hover:     rgba(255,255,255,0.72);
      --glass-border:       rgba(255,255,255,0.65);
      --glass-border-soft:  rgba(15,23,42,0.08);
      --glass-sheen:        rgba(255,255,255,0.9);
      --glass-shadow:       0 1px 0 rgba(255,255,255,0.85) inset,
                            0 0 0 1px rgba(255,255,255,0.45) inset,
                            0 10px 30px -10px rgba(15,23,42,0.18),
                            0 4px 12px -4px rgba(15,23,42,0.10);
      --glass-shadow-lift:  0 1px 0 rgba(255,255,255,0.95) inset,
                            0 0 0 1px rgba(255,255,255,0.55) inset,
                            0 20px 50px -12px rgba(99,102,241,0.30),
                            0 10px 24px -6px rgba(15,23,42,0.18);
      --skel:                rgba(15,23,42,0.06);
      --bg-base:             #f8f7ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg:#f0f3ff;
        --muted:#9aa3bd;
        --bad:#fb7185;
        --accent-a:#a78bfa;
        --accent-b:#22d3ee;
        --accent-c:#fb7185;
        --accent-d:#fcd34d;
        --glass-bg:           rgba(20,24,38,0.55);
        --glass-bg-hover:     rgba(28,33,52,0.70);
        --glass-border:       rgba(255,255,255,0.10);
        --glass-border-soft:  rgba(255,255,255,0.06);
        --glass-sheen:        rgba(255,255,255,0.18);
        --glass-shadow:       0 1px 0 rgba(255,255,255,0.10) inset,
                              0 0 0 1px rgba(255,255,255,0.06) inset,
                              0 14px 32px -10px rgba(0,0,0,0.55),
                              0 6px 14px -4px rgba(0,0,0,0.35);
        --glass-shadow-lift:  0 1px 0 rgba(255,255,255,0.16) inset,
                              0 0 0 1px rgba(255,255,255,0.10) inset,
                              0 24px 60px -14px rgba(124,58,237,0.45),
                              0 14px 28px -8px rgba(0,0,0,0.5);
        --skel:                rgba(255,255,255,0.06);
        --bg-base:             #07091a;
      }
    }

    html, body { margin:0; padding:0; min-height:100%; color: var(--fg);
      background: var(--bg-base);
      font: 14px -apple-system, BlinkMacSystemFont, "Inter", "SF Pro Text",
            "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased; }

    /* Animated mesh gradient behind everything. Pseudo-element so the
       blur/saturation on glass surfaces actually has something to refract. */
    body::before {
      content:""; position: fixed; inset:-15%; z-index:-1; pointer-events:none;
      background:
        radial-gradient(40% 35% at 18% 22%, color-mix(in oklab, var(--accent-a) 75%, transparent), transparent 70%),
        radial-gradient(38% 32% at 82% 18%, color-mix(in oklab, var(--accent-b) 70%, transparent), transparent 70%),
        radial-gradient(45% 40% at 80% 78%, color-mix(in oklab, var(--accent-c) 65%, transparent), transparent 72%),
        radial-gradient(35% 30% at 22% 82%, color-mix(in oklab, var(--accent-d) 60%, transparent), transparent 70%);
      filter: blur(60px) saturate(120%);
      opacity: .55;
      animation: drift 26s ease-in-out infinite alternate;
    }
    @media (prefers-color-scheme: dark) {
      body::before { opacity: .60; filter: blur(80px) saturate(140%); }
    }
    @keyframes drift {
      0%   { transform: translate3d(0, 0, 0) scale(1); }
      50%  { transform: translate3d(-2%, 1.5%, 0) scale(1.04); }
      100% { transform: translate3d(2%, -1%, 0) scale(1.02); }
    }

    .wrap { padding: 18px 16px 24px; max-width: 760px; margin: 0 auto; }

    /* ---------- Header ---------- */
    .header { display:flex; align-items:flex-start; justify-content:space-between;
      margin: 0 4px 16px; gap:12px; flex-wrap:wrap; }
    .title h1 { margin:0; font-size:18px; font-weight:700;
      letter-spacing:-0.02em;
      background: linear-gradient(135deg, var(--fg), color-mix(in oklab, var(--fg) 60%, var(--accent-a)));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .title p  { margin:4px 0 0; color: var(--muted); font-size:12px; }

    .tag { display:inline-flex; align-items:center; gap:6px;
      padding:5px 11px; border-radius:999px;
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      color: var(--fg); font-size:11px; font-weight:600;
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      white-space:nowrap; text-transform:capitalize; }
    .tag::before { content:""; width:7px; height:7px; border-radius:999px;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      box-shadow: 0 0 8px color-mix(in oklab, var(--accent-a) 70%, transparent); }

    /* ---------- Category picker chips ---------- */
    .chips { display:flex; gap:8px; overflow-x:auto; padding: 2px 4px 14px;
      scrollbar-width:none; -webkit-overflow-scrolling:touch;
      margin: 0 -4px 6px; }
    .chips::-webkit-scrollbar { display:none; }
    .chip { position:relative; padding:7px 14px; border-radius:999px;
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      color: var(--fg); font: 600 12px inherit; cursor:pointer;
      white-space:nowrap; flex-shrink:0;
      transition: transform .2s cubic-bezier(.2,.7,.2,1),
                  box-shadow .25s ease, background .25s ease, color .25s ease; }
    .chip:hover { background: var(--glass-bg-hover); transform: translateY(-1px); }
    .chip:focus-visible { outline: 2px solid color-mix(in oklab, var(--accent-b) 80%, transparent);
      outline-offset: 2px; }
    .chip.active {
      color:#fff;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      border-color: transparent;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.55) inset,
        0 0 0 1px rgba(255,255,255,0.25) inset,
        0 10px 28px -6px color-mix(in oklab, var(--accent-a) 65%, transparent),
        0 4px 14px -2px color-mix(in oklab, var(--accent-b) 55%, transparent);
    }
    .chip .count { opacity:.65; font-weight:500; margin-left:5px; font-variant-numeric: tabular-nums; }
    .chip.active .count { opacity:.95; }
    .chip.err { color: var(--bad); border-color: color-mix(in oklab, var(--bad) 40%, var(--glass-border)); }
    .chip.err::after { content:" ⚠"; }

    /* ---------- Article list ---------- */
    .list { display:flex; flex-direction:column; gap:12px; }

    .card { position:relative; display:flex; gap:12px; align-items:stretch;
      background: var(--glass-bg);
      backdrop-filter: blur(22px) saturate(190%);
      -webkit-backdrop-filter: blur(22px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-radius:16px; overflow:hidden;
      box-shadow: var(--glass-shadow);
      cursor:pointer; text-align:left; padding:0; width:100%;
      font: inherit; color: inherit;
      transition: transform .25s cubic-bezier(.2,.7,.2,1),
                  box-shadow .25s cubic-bezier(.2,.7,.2,1),
                  background .25s ease; }
    /* Top-edge specular highlight — subtle gloss like real glass */
    .card::after { content:""; position:absolute; left:0; right:0; top:0; height:40%;
      pointer-events:none;
      background: linear-gradient(180deg,
        var(--glass-sheen) 0%,
        color-mix(in oklab, var(--glass-sheen) 40%, transparent) 50%,
        transparent 100%);
      mix-blend-mode: overlay;
      opacity:.55; }
    .card:hover { transform: translateY(-2px) scale(1.003);
      box-shadow: var(--glass-shadow-lift);
      background: var(--glass-bg-hover); }
    .card:focus-visible { outline: 2px solid color-mix(in oklab, var(--accent-b) 80%, transparent);
      outline-offset: 3px; }

    .thumb { position:relative; flex: 0 0 132px; aspect-ratio: 4 / 3;
      background: var(--skel); overflow:hidden; align-self:stretch;
      border-right: 1px solid var(--glass-border-soft); }
    @media (max-width: 420px) { .thumb { flex-basis: 108px; } }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block;
      opacity:0; transition: opacity .4s ease, transform .7s cubic-bezier(.2,.7,.2,1); }
    .thumb img.loaded { opacity:1; }
    .card:hover .thumb img.loaded { transform: scale(1.08); }
    .thumb .fallback { position:absolute; inset:0; display:flex; align-items:center;
      justify-content:center; font-size:30px; color: var(--muted);
      background: linear-gradient(135deg,
        color-mix(in oklab, var(--accent-a) 25%, transparent),
        color-mix(in oklab, var(--accent-b) 25%, transparent)); }
    /* Faint specular shimmer that sweeps across the thumb on hover */
    .thumb::after {
      content:""; position:absolute; top:0; left:-60%; width:50%; height:100%;
      background: linear-gradient(120deg, transparent 0%,
        rgba(255,255,255,.45) 50%, transparent 100%);
      transform: skewX(-22deg); transition: left .7s ease; pointer-events:none;
      mix-blend-mode: overlay;
    }
    .card:hover .thumb::after { left: 120%; }

    .body { flex:1; min-width:0; padding:12px 14px 12px 6px;
      display:flex; flex-direction:column; justify-content:space-between; gap:6px; }
    .headline { margin:0; font-size:14px; font-weight:600; line-height:1.35;
      display:-webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow:hidden; letter-spacing:-0.005em; }
    .summary { margin:0; font-size:12px; color: var(--muted); line-height:1.45;
      display:-webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow:hidden; }
    .meta { display:flex; align-items:center; gap:7px; flex-wrap:wrap;
      color: var(--muted); font-size:11px; }
    .meta .src { font-weight:600;
      background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      max-width: 16ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .meta .dot { width:3px; height:3px; border-radius:999px; background: currentColor;
      opacity:.6; }
    .meta .open-ic { margin-left:auto; font-size:11px; opacity:.5; }
    .card:hover .meta .open-ic { opacity:1; transform: translate(1px, -1px); }

    /* ---------- Skeletons ---------- */
    .skeleton { display:flex; gap:12px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      border: 1px solid var(--glass-border);
      border-radius:16px; overflow:hidden;
      box-shadow: var(--glass-shadow); }
    .skeleton .thumb { flex: 0 0 132px; aspect-ratio: 4 / 3;
      background:
        linear-gradient(90deg,
          var(--skel) 0%,
          color-mix(in oklab, var(--skel) 50%, transparent) 50%,
          var(--skel) 100%);
      background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
    @media (max-width: 420px) { .skeleton .thumb { flex-basis: 108px; } }
    .skeleton .sk-body { flex:1; padding:14px 14px 14px 6px;
      display:flex; flex-direction:column; gap:8px; justify-content:center; }
    .skeleton .sk-line { height:10px; background: var(--skel); border-radius:6px; }
    .skeleton .sk-line.short { width:55%; }
    .skeleton .sk-line.tiny  { width:35%; height:8px; }
    @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }

    /* ---------- Footer / banner / empty ---------- */
    .footer { text-align:center; padding:16px 8px 4px; color: var(--muted); font-size:11px; }
    .footer a { color: var(--muted); text-decoration: none; border-bottom: 1px dashed var(--glass-border-soft); }
    .empty { text-align:center; padding:40px 16px; color: var(--muted); font-size:13px;
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--glass-border); border-radius: 16px;
      box-shadow: var(--glass-shadow); }
    .empty .ic { font-size:34px; display:block; margin-bottom:10px; }

    .banner { padding:14px 16px; border-radius:14px;
      background: var(--glass-bg);
      backdrop-filter: blur(18px) saturate(180%);
      -webkit-backdrop-filter: blur(18px) saturate(180%);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      margin: 4px 0 10px; font-size:13px; line-height:1.5; }
    .banner.err { border-color: color-mix(in oklab, var(--bad) 50%, var(--glass-border));
      color: var(--bad); }
    .banner code { font-family: ui-monospace, monospace; font-size:12px;
      padding:1px 6px; background: color-mix(in oklab, var(--bad) 12%, transparent);
      border-radius:6px; color: inherit; }
    .banner a { color: inherit; text-decoration: underline; }

    .status { color: var(--muted); font-size:11px; padding: 10px 4px 0;
      font-family: ui-monospace, "SF Mono", monospace; min-height:14px;
      word-break: break-word; opacity:.7; }

    /* Reduced-motion: pin the mesh */
    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
      .card, .chip { transition: none; }
      .skeleton .thumb { animation: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">
        <h1>Top headlines</h1>
        <p id="subtitle">Live from NewsAPI · Tap a story to open it.</p>
      </div>
      <span class="tag" id="tag">News</span>
    </div>

    <div class="chips" id="chips" role="tablist"></div>
    <div class="list" id="list"></div>
    <div class="footer">
      Powered by <a href="https://newsapi.org" target="_blank" rel="noopener">NewsAPI.org</a>
    </div>
    <div class="status" id="status">log: ready</div>
  </div>

<!-- Server inlines the latest show_headlines result here at resource-read time -->
<script type="application/json" id="headlines-payload">__HEADLINES_PAYLOAD__</script>

<script type="module">
  import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@1.7.1/dist/src/app-with-deps.js";

  const PROXY = "https://wsrv.nl/?url=";
  const FALLBACK_EMOJI = "📰";

  const listEl     = document.getElementById("list");
  const statusEl   = document.getElementById("status");
  const tagEl      = document.getElementById("tag");
  const subtitleEl = document.getElementById("subtitle");
  const chipsEl    = document.getElementById("chips");

  const CATEGORY_LABELS = {
    general:       "Top",
    business:      "Finance",
    technology:    "Tech",
    science:       "Science",
    health:        "Health",
    sports:        "Sports",
    entertainment: "Entertainment",
  };

  let rendered = false;
  let bundle = null;       // { categories, search, query, current, category_order }
  let currentTab = null;   // category id OR "search"

  // --- Helpers --------------------------------------------------------------
  function setStatus(text) { statusEl.textContent = text; }

  function proxyImg(url, w = 360, h = 270) {
    if (!url) return null;
    return PROXY + encodeURIComponent(url) +
      `&w=${w}&h=${h}&fit=cover&a=attention&output=webp&q=80`;
  }

  function timeAgo(iso) {
    const then = new Date(iso).getTime();
    if (!Number.isFinite(then)) return "";
    const s = Math.max(1, (Date.now() - then) / 1000 | 0);
    if (s < 60) return s + "s ago";
    const m = s / 60 | 0;       if (m < 60) return m + "m ago";
    const h = m / 60 | 0;       if (h < 24) return h + "h ago";
    const d = h / 24 | 0;       if (d <  7) return d + "d ago";
    const w = d / 7 | 0;        if (w <  5) return w + "w ago";
    const mo = d / 30 | 0;      if (mo < 12) return mo + "mo ago";
    return (d / 365 | 0) + "y ago";
  }

  // --- Initial skeletons (shown while waiting for the tool result) ---------
  function showSkeletons(n = 5) {
    listEl.innerHTML = "";
    for (let i = 0; i < n; i++) {
      const s = document.createElement("div");
      s.className = "skeleton";
      s.innerHTML = `
        <div class="thumb"></div>
        <div class="sk-body">
          <div class="sk-line"></div>
          <div class="sk-line short"></div>
          <div class="sk-line tiny"></div>
        </div>`;
      listEl.appendChild(s);
    }
  }

  // --- Cards ---------------------------------------------------------------
  function renderCard(article) {
    const card = document.createElement("button");
    card.className = "card";
    card.type = "button";

    const imgSrc = proxyImg(article.image);
    const ago = timeAgo(article.published_at);

    card.innerHTML = `
      <div class="thumb">
        ${imgSrc
          ? `<img alt="" loading="lazy" referrerpolicy="no-referrer" decoding="async">
             <div class="fallback" style="display:none">${FALLBACK_EMOJI}</div>`
          : `<div class="fallback">${FALLBACK_EMOJI}</div>`}
      </div>
      <div class="body">
        <p class="headline"></p>
        <p class="summary"></p>
        <div class="meta">
          <span class="src"></span><span class="dot"></span>
          <span class="ago"></span>
          <span class="open-ic">↗</span>
        </div>
      </div>
    `;
    card.querySelector(".headline").textContent = article.title || "Untitled";
    card.querySelector(".summary").textContent = article.summary || "";
    card.querySelector(".src").textContent = article.source || "Unknown";
    card.querySelector(".ago").textContent = ago;

    const img = card.querySelector("img");
    if (img) {
      img.addEventListener("load", () => img.classList.add("loaded"));
      img.addEventListener("error", () => {
        img.remove();
        const fb = card.querySelector(".fallback");
        if (fb) fb.style.display = "flex";
      });
      img.src = imgSrc;
    }

    card.addEventListener("click", () => openArticle(article));
    return card;
  }

  async function openArticle(article) {
    if (!article.url) return;
    try {
      await app.openLink({ url: article.url });
      setStatus(`log: openLink ok — ${article.source || "source"}`);
    } catch (e) {
      setStatus("log: openLink error: " + (e?.message || e));
    }
  }

  function showBannerHTML(html, isError = false) {
    listEl.innerHTML = "";
    const div = document.createElement("div");
    div.className = "banner" + (isError ? " err" : "");
    div.innerHTML = html;
    listEl.appendChild(div);
  }
  function showEmpty(text) {
    listEl.innerHTML = "";
    const div = document.createElement("div");
    div.className = "empty";
    div.innerHTML = `<span class="ic">🗞️</span>${text}`;
    listEl.appendChild(div);
  }

  // --- Apply the show_headlines bundle (categories + optional search) -------
  function applyPayload(payload) {
    if (rendered) return;
    if (!payload || typeof payload !== "object") return;
    rendered = true;

    if (!payload.ok) {
      const code = payload.code || "";
      const msg = payload.error || "Couldn't load headlines.";
      const hint = code === "no_api_key"
        ? `<br><br>Set <code>NEWSAPI_KEY</code> on the MCP server and reconnect. <a href="https://newsapi.org/register" target="_blank" rel="noopener">Get a free key</a>.`
        : code === "rateLimited"
          ? "<br><br>NewsAPI free tier is rate-limited (100 requests/day). Try again later."
          : "";
      showBannerHTML(`${msg}${hint}`, true);
      setStatus(`log: error — ${code}: ${msg}`);
      return;
    }

    bundle = payload;
    currentTab = payload.current || (payload.query ? "search" : "general");
    renderChips();
    renderActiveTab();
  }

  function renderChips() {
    if (!bundle) return;
    chipsEl.innerHTML = "";

    const order = Array.isArray(bundle.category_order) && bundle.category_order.length
      ? bundle.category_order
      : Object.keys(bundle.categories || {});

    // Optional "Search" chip first when a query was issued.
    if (bundle.query) {
      const sr = bundle.search || {};
      const count = Array.isArray(sr.articles) ? sr.articles.length : 0;
      chipsEl.appendChild(makeChip(
        "search",
        `Search: "${bundle.query}"`,
        count,
        sr.ok === false
      ));
    }

    for (const cat of order) {
      const block = (bundle.categories || {})[cat] || {};
      const count = Array.isArray(block.articles) ? block.articles.length : 0;
      chipsEl.appendChild(makeChip(
        cat,
        CATEGORY_LABELS[cat] || capitalize(cat),
        count,
        block.ok === false
      ));
    }
  }

  function makeChip(id, label, count, isErr) {
    const b = document.createElement("button");
    b.type = "button";
    b.role = "tab";
    b.className = "chip" + (id === currentTab ? " active" : "") + (isErr ? " err" : "");
    b.setAttribute("aria-selected", String(id === currentTab));
    b.innerHTML = `${escape(label)}${count ? `<span class="count">${count}</span>` : ""}`;
    b.addEventListener("click", () => {
      if (id === currentTab) return;
      currentTab = id;
      renderChips();
      renderActiveTab();
    });
    return b;
  }

  function renderActiveTab() {
    if (!bundle) return;
    const block = (currentTab === "search")
      ? (bundle.search || {})
      : ((bundle.categories || {})[currentTab] || {});

    // Header tag + subtitle reflect the active tab.
    if (currentTab === "search") {
      tagEl.textContent = `Search: "${bundle.query}"`;
    } else {
      tagEl.textContent = CATEGORY_LABELS[currentTab] || capitalize(currentTab);
    }

    const articles = Array.isArray(block.articles) ? block.articles : [];
    const total = block.total_results
      ? ` · ${block.total_results.toLocaleString()} results`
      : (articles.length ? ` · ${articles.length} shown` : "");
    subtitleEl.textContent = `Live from NewsAPI${total} · Tap a story to open it.`;

    if (block.ok === false) {
      const code = block.code || "";
      const msg = block.error || "Couldn't load this category.";
      const hint = code === "rateLimited"
        ? "<br><br>NewsAPI free tier is rate-limited (100 requests/day)."
        : "";
      showBannerHTML(`${msg}${hint}`, true);
      setStatus(`log: tab error — ${code}: ${msg}`);
      return;
    }

    if (articles.length === 0) {
      showEmpty(currentTab === "search"
        ? `No results for "${bundle.query}".`
        : "No stories in this category right now.");
      return;
    }

    listEl.innerHTML = "";
    for (const a of articles) listEl.appendChild(renderCard(a));
    setStatus(`log: ${currentTab} — ${articles.length} stories`);
  }

  function capitalize(s) {
    return s && s.length ? s[0].toUpperCase() + s.slice(1) : s;
  }
  function escape(s) {
    return String(s).replace(/[&<>"']/g, ch => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;",
    }[ch]));
  }

  // --- Extract structured payload from a tool result --------------------
  function extractPayload(params) {
    if (!params || typeof params !== "object") return null;
    if (params.structuredContent && typeof params.structuredContent === "object") {
      return params.structuredContent;
    }
    const text = params.content?.[0]?.text;
    if (typeof text === "string" && text.trim().startsWith("{")) {
      try { return JSON.parse(text); } catch { /* fall through */ }
    }
    return null;
  }

  // --- Read articles inlined in the resource HTML --------------------------
  function readInlinedPayload() {
    const el = document.getElementById("headlines-payload");
    if (!el) return null;
    const text = (el.textContent || "").trim();
    // Server didn't substitute the placeholder — pretend we got nothing.
    if (!text || text.startsWith("__")) return null;
    try { return JSON.parse(text); } catch { return null; }
  }

  // --- Connect --------------------------------------------------------------
  showSkeletons(5);

  const inlined = readInlinedPayload();
  if (inlined) {
    applyPayload(inlined);
    setStatus("log: rendered from inlined payload");
  }

  const app = new App({ name: "headlines", version: "2.1.0" });
  app.onerror = (e) => setStatus("log: error: " + (e?.message || e));

  // Optional: if the host *does* deliver the tool result via notification,
  // honor it as a fallback (the inlined payload still wins via `rendered`).
  app.ontoolresult = (params) => {
    if (rendered) return;
    setStatus("log: tool-result received");
    const payload = extractPayload(params);
    if (payload) applyPayload(payload);
  };

  app.ontoolinput = (params) => {
    const args = (params?.arguments && typeof params.arguments === "object")
      ? params.arguments : params;
    const label =
      args?.query ? `Search: "${args.query}"` :
      args?.category ? capitalize(args.category) :
      tagEl.textContent;
    tagEl.textContent = label;
    setStatus(`log: tool-input cat=${args?.category || ""} q="${args?.query || ""}"`);
  };

  app.connect();

  // Last-ditch fallback if nothing rendered (placeholder wasn't substituted
  // AND no notification arrived).
  setTimeout(() => {
    if (!rendered) {
      showBannerHTML(
        "Couldn't load headlines. Ask Toto to show the news again, " +
        "or check that <code>NEWSAPI_KEY</code> is set on the server.",
        true
      );
      setStatus("log: timeout — no payload received");
    }
  }, 8000);
</script>
</body>
</html>
