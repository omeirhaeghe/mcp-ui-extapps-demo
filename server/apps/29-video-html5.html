<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HTML5 Video — MCP App</title>
  <style>
    :root { color-scheme: light dark;
      --fg:#1a1a1a; --muted:#6b7280; --bg:#fff; --card:#f7f7f8;
      --border:#e5e7eb; --accent:#2563eb; --btn:#e5e7eb; --btn-fg:#111;
      --good:#10b981; --warn:#f59e0b; --bad:#ef4444; }
    @media (prefers-color-scheme: dark) { :root {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#0b0c0f; --card:#16181d;
      --border:#23262d; --accent:#7aa2ff; --btn:#23262d; --btn-fg:#e5e7eb; } }
    html,body { margin:0; padding:0; color:var(--fg); background:var(--bg);
      font:14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .wrap { margin:14px; background:var(--card); border:1px solid var(--border);
      border-radius:10px; overflow:hidden; }
    .urlbar { display:flex; gap:6px; align-items:center; padding:8px 10px;
      border-bottom:1px solid var(--border); }
    .urlbar input { flex:1; padding:6px 10px; background:var(--bg);
      border:1px solid var(--border); border-radius:5px; color:var(--fg);
      font: 12px ui-monospace, monospace; }
    .urlbar button { background:var(--btn); color:var(--btn-fg);
      border:1px solid var(--border); border-radius:5px; padding:5px 10px;
      font-size:12px; cursor:pointer; font-family:inherit; }
    .urlbar button.primary { background:var(--accent); color:#fff; border-color:transparent; }
    .badge { font-size:10px; padding:2px 8px; border-radius:999px;
      background:var(--btn); color:var(--btn-fg);
      font-family: ui-monospace, monospace; }
    .badge.ok   { background:#10b98122; color:var(--good); }
    .badge.warn { background:#f59e0b22; color:var(--warn); }
    .badge.bad  { background:#ef444222; color:var(--bad); }

    .stage { position:relative; aspect-ratio:16/9; background:#000; }
    video { position:absolute; inset:0; width:100%; height:100%; display:block;
      background:#000; }
    .overlay { position:absolute; inset:0; padding:20px;
      display:none; flex-direction:column; gap:10px; align-items:center;
      justify-content:center; text-align:center; background:var(--card);
      color:var(--muted); }
    .overlay.visible { display:flex; }
    .overlay h2 { margin:0; font-size:14px; color:var(--fg); }
    .overlay p { margin:0; font-size:12px; max-width:380px; }
    .overlay code { font-family: ui-monospace, monospace; font-size:11px;
      background:var(--btn); color:var(--btn-fg); padding:1px 6px; border-radius:4px; }

    .footer { padding:10px 12px; border-top:1px solid var(--border);
      display:flex; flex-wrap:wrap; gap:6px; align-items:center;
      font-size:11px; color:var(--muted); }
    .pill { padding:2px 8px; border-radius:999px;
      background:var(--btn); color:var(--btn-fg);
      font-family: ui-monospace, monospace; font-size:10px;
      cursor:pointer; user-select:none; }
    .pill:hover { filter: brightness(1.05); }
    .log { margin-left:auto; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="urlbar">
      <span class="badge" id="badge">…</span>
      <input id="url" type="text" spellcheck="false" autocomplete="off"
        placeholder="https://…/video.mp4">
      <button id="play" class="primary">Load ▶</button>
      <button id="open">Open ↗</button>
    </div>

    <div class="stage">
      <video id="video" controls playsinline preload="metadata"></video>
      <div class="overlay" id="overlay">
        <h2 id="ov-title">No video</h2>
        <p id="ov-body">Paste a direct video file URL (<code>.mp4</code>,
          <code>.webm</code>, <code>.ogg</code>) and press <strong>Load ▶</strong>.</p>
      </div>
    </div>

    <div class="footer">
      <span>Try:</span>
      <span class="pill" data-url="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4">Big Buck Bunny</span>
      <span class="pill" data-url="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4">Elephants Dream</span>
      <span class="pill" data-url="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4">For Bigger Blazes</span>
      <span class="log" id="log">log: ready</span>
    </div>
  </div>

<script type="module">
  import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@1.7.1/dist/src/app-with-deps.js";

  const urlInput = document.getElementById('url');
  const video    = document.getElementById('video');
  const overlay  = document.getElementById('overlay');
  const ovTitle  = document.getElementById('ov-title');
  const ovBody   = document.getElementById('ov-body');
  const badge    = document.getElementById('badge');
  const playBtn  = document.getElementById('play');
  const openBtn  = document.getElementById('open');
  const log      = document.getElementById('log');
  const pills    = document.querySelectorAll('.pill[data-url]');

  function setBadge(state, text) { badge.className = 'badge ' + state; badge.textContent = text; }
  function showOverlay(t, b) { ovTitle.textContent = t; if (b) ovBody.textContent = b; overlay.classList.add('visible'); }
  function hideOverlay() { overlay.classList.remove('visible'); }

  let currentUrl = "";

  function load(raw) {
    const url = (raw || "").trim();
    if (!url) {
      currentUrl = "";
      video.removeAttribute('src'); video.load();
      setBadge('bad', 'no url'); showOverlay("No source", null);
      log.textContent = 'log: empty url';
      return;
    }
    let parsed;
    try { parsed = new URL(url); } catch {
      setBadge('bad', 'bad url'); showOverlay("That's not a valid URL", null);
      log.textContent = 'log: invalid url — ' + url; return;
    }
    if (parsed.protocol !== 'https:') {
      setBadge('bad', 'needs https'); showOverlay("Source must be served over HTTPS",
        "Mixed-content rules block plain http:// media inside the widget.");
      log.textContent = 'log: non-https — ' + url; return;
    }
    currentUrl = url;
    hideOverlay();
    setBadge('warn', 'loading…');
    video.src = url;
    video.load();
    log.textContent = 'log: loading ' + url;
  }

  video.addEventListener('loadeddata', () => { setBadge('ok', 'ready'); hideOverlay(); log.textContent = 'log: ready'; });
  video.addEventListener('playing',   () => { setBadge('ok', 'playing'); });
  video.addEventListener('pause',     () => { if (!video.ended) setBadge('warn', 'paused'); });
  video.addEventListener('ended',     () => { setBadge('ok', 'ended'); });
  video.addEventListener('error', () => {
    setBadge('bad', 'load error');
    showOverlay("Couldn't load that video",
      "The host may block cross-origin media (CORS / media-src CSP), or the " +
      "format isn't supported. Try Open ↗ to view it directly.");
    log.textContent = 'log: error loading ' + currentUrl;
  });

  playBtn.addEventListener('click', () => load(urlInput.value));
  urlInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') load(urlInput.value); });
  pills.forEach(p => p.addEventListener('click', () => { urlInput.value = p.dataset.url; load(p.dataset.url); }));

  const app = new App({ name: "html5-video-widget", version: "1.0.0" });

  openBtn.addEventListener('click', async () => {
    if (!currentUrl) return;
    try { await app.openLink({ url: currentUrl }); }
    catch (err) { log.textContent = 'openLink error: ' + (err?.message || err); }
  });

  app.ontoolinput = (params) => {
    const args = params.arguments || {};
    const url = (args.url || args.src || "").trim();
    if (url) { urlInput.value = url; load(url); }
  };

  app.connect().then(() => {
    if (!currentUrl) {
      urlInput.value = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";
      load(urlInput.value);
    }
  });
</script>
</body>
</html>
