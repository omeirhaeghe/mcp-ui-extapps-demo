<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>News Roll — MCP App</title>
  <style>
    :root { color-scheme: light dark;
      --fg:#0f172a; --muted:#64748b; --bg:#ffffff; --card:#ffffff;
      --border:#e5e7eb; --accent:#0ea5e9; --accent-2:#6366f1;
      --skel:#eef0f3; --chip:#f1f5f9;
      --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.06);
      --shadow-lift: 0 2px 6px rgba(15,23,42,.08), 0 14px 30px rgba(14,165,233,.18); }
    @media (prefers-color-scheme: dark) { :root {
      --fg:#e5e7eb; --muted:#94a3b8; --bg:#0b0c0f; --card:#14161b;
      --border:#23262d; --accent:#38bdf8; --accent-2:#818cf8;
      --skel:#1c1f26; --chip:#1c2230;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
      --shadow-lift: 0 2px 6px rgba(0,0,0,.4), 0 14px 30px rgba(56,189,248,.22); } }

    html, body { margin:0; padding:0; color:var(--fg); background:var(--bg);
      font:14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

    .wrap { padding:16px 14px 22px; }
    .header { display:flex; align-items:center; justify-content:space-between;
      margin: 0 4px 12px; gap:12px; }
    .title h1 { margin:0; font-size:16px; font-weight:700; letter-spacing:-0.01em; }
    .title p  { margin:2px 0 0; color:var(--muted); font-size:12px; }
    .sponsored { display:inline-flex; align-items:center; gap:6px;
      padding:3px 9px; border-radius:999px; background: var(--chip);
      color: var(--muted); font-size:10px; font-weight:600; letter-spacing:.04em;
      text-transform:uppercase; border:1px solid var(--border); }
    .sponsored::before { content:""; width:6px; height:6px; border-radius:999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); }

    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

    .card { position:relative; background: var(--card);
      border:1px solid var(--border); border-radius:12px; overflow:hidden;
      box-shadow: var(--shadow); cursor:pointer; text-align:left;
      transition: transform .25s cubic-bezier(.2,.7,.2,1),
                  box-shadow .25s cubic-bezier(.2,.7,.2,1),
                  border-color .2s ease; }
    .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift);
      border-color: transparent; }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .thumb { position:relative; width:100%; aspect-ratio: 16 / 9;
      background: var(--skel); overflow:hidden; }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block;
      opacity:0; transition: opacity .35s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
    .thumb img.loaded { opacity:1; }
    .card:hover .thumb img.loaded { transform: scale(1.05); }
    .thumb .fallback { position:absolute; inset:0; display:flex; align-items:center;
      justify-content:center; font-size:32px; color: var(--muted);
      background: linear-gradient(135deg, var(--skel), var(--chip)); }
    .src-chip { position:absolute; left:8px; bottom:8px; max-width: calc(100% - 16px);
      padding:3px 8px; border-radius:6px; background: rgba(0,0,0,.65);
      color:#fff; font-size:10px; font-weight:600; letter-spacing:.02em;
      backdrop-filter: blur(6px); overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; }

    .body { padding:10px 12px 12px; }
    .headline { margin:0 0 6px; font-size:14px; font-weight:600; line-height:1.3;
      display:-webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow:hidden; }
    .summary { margin:0; font-size:12px; color: var(--muted); line-height:1.4;
      display:-webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow:hidden; }
    .meta { margin-top:8px; display:flex; align-items:center; gap:6px;
      color: var(--muted); font-size:11px; font-variant-numeric: tabular-nums; }
    .meta .dot { width:3px; height:3px; border-radius:999px; background: currentColor;
      opacity:.6; }
    .meta .promo { color: var(--accent); font-weight:600; }

    /* Skeleton placeholders */
    .skeleton { background: var(--card); border:1px solid var(--border);
      border-radius:12px; overflow:hidden; }
    .skeleton .thumb { background: linear-gradient(90deg, var(--skel) 0%, var(--chip) 50%, var(--skel) 100%);
      background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
    .skeleton .sk-line { height:10px; background: var(--skel); border-radius:4px;
      margin:8px 12px; }
    .skeleton .sk-line.short { width:60%; }
    @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }

    .sentinel { grid-column: 1 / -1; padding:18px 0;
      display:flex; align-items:center; justify-content:center; gap:8px;
      color: var(--muted); font-size:12px; }
    .spinner { width:14px; height:14px; border:2px solid var(--border);
      border-top-color: var(--accent); border-radius:999px;
      animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }

    .end { grid-column: 1 / -1; text-align:center; padding:18px 8px 6px;
      color: var(--muted); font-size:12px; }
    .end .more { display:inline-block; margin-top:6px; padding:7px 14px;
      border-radius:999px; border:1px solid var(--border); background: var(--card);
      color: var(--fg); cursor:pointer; font:600 12px inherit; }
    .end .more:hover { background: var(--bg); }

    .err { grid-column: 1 / -1; padding:14px; text-align:center;
      color:#dc2626; font-size:13px; }

    .status { color: var(--muted); font-size:11px; padding: 8px 4px 0;
      font-family: ui-monospace, monospace; min-height:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">
        <h1>Latest news</h1>
        <p>Scroll for more. Tap any story to open the source.</p>
      </div>
      <span class="sponsored">Around the web</span>
    </div>

    <div class="grid" id="grid"></div>
    <div class="status" id="status">log: ready</div>
  </div>

<script type="module">
  import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@1.7.1/dist/src/app-with-deps.js";

  const API = "https://api.spaceflightnewsapi.net/v4/articles/";
  const PAGE_SIZE = 12;
  const PROXY = "https://wsrv.nl/?url=";

  const grid = document.getElementById("grid");
  const status = document.getElementById("status");

  let offset = 0;
  let loading = false;
  let exhausted = false;
  let total = Infinity;
  let io = null;
  let sentinel = null;

  // Promoted-ish chips that occasionally appear in real Taboola feeds.
  // Purely cosmetic — keeps things believable as an "endless roll".
  const PROMOS = ["Promoted", "Editor's pick", "Trending", "Sponsored", "Featured"];
  function maybePromo(i) {
    // Roughly every 5th card gets a chip, deterministic per absolute index.
    return (i % 5 === 4) ? PROMOS[(i / 5 | 0) % PROMOS.length] : null;
  }

  function timeAgo(iso) {
    const then = new Date(iso).getTime();
    if (!Number.isFinite(then)) return "";
    const s = Math.max(1, (Date.now() - then) / 1000 | 0);
    if (s < 60) return s + "s ago";
    const m = s / 60 | 0;       if (m < 60) return m + "m ago";
    const h = m / 60 | 0;       if (h < 24) return h + "h ago";
    const d = h / 24 | 0;       if (d <  7) return d + "d ago";
    const w = d / 7 | 0;        if (w <  5) return w + "w ago";
    const mo = d / 30 | 0;      if (mo < 12) return mo + "mo ago";
    return (d / 365 | 0) + "y ago";
  }

  function proxyImg(url, w = 480, h = 270) {
    if (!url) return null;
    return PROXY + encodeURIComponent(url) +
      `&w=${w}&h=${h}&fit=cover&a=attention&output=webp&q=80`;
  }

  function skeletons(n) {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const s = document.createElement("div");
      s.className = "skeleton";
      s.dataset.role = "skel";
      s.innerHTML = `
        <div class="thumb"></div>
        <div class="sk-line"></div>
        <div class="sk-line short"></div>`;
      frag.appendChild(s);
    }
    return frag;
  }
  function clearSkeletons() {
    grid.querySelectorAll('[data-role="skel"]').forEach(n => n.remove());
  }

  function renderCard(article, absIndex) {
    const card = document.createElement("button");
    card.className = "card";
    card.type = "button";
    card.dataset.url = article.url || "";

    const promo = maybePromo(absIndex);
    const ago = timeAgo(article.published_at);
    const src = article.news_site || "Unknown";

    const imgSrc = proxyImg(article.image_url);

    card.innerHTML = `
      <div class="thumb">
        ${imgSrc
          ? `<img alt="" loading="lazy" referrerpolicy="no-referrer" decoding="async">
             <div class="fallback" style="display:none">🛰️</div>`
          : `<div class="fallback">🛰️</div>`}
        <div class="src-chip"></div>
      </div>
      <div class="body">
        <p class="headline"></p>
        <p class="summary"></p>
        <div class="meta">
          ${promo ? `<span class="promo">${promo}</span><span class="dot"></span>` : ""}
          <span class="ago"></span>
        </div>
      </div>
    `;

    card.querySelector(".src-chip").textContent = src;
    card.querySelector(".headline").textContent = article.title || "Untitled";
    card.querySelector(".summary").textContent = article.summary || "";
    card.querySelector(".ago").textContent = ago;

    const img = card.querySelector("img");
    if (img) {
      img.addEventListener("load", () => img.classList.add("loaded"));
      img.addEventListener("error", () => {
        img.remove();
        const fb = card.querySelector(".fallback");
        if (fb) fb.style.display = "flex";
      });
      img.src = imgSrc;
    }

    card.addEventListener("click", () => openArticle(article));
    return card;
  }

  async function openArticle(article) {
    const url = article.url;
    if (!url) return;
    try {
      await app.openLink({ url });
      status.textContent = `log: openLink ok — ${article.news_site || "source"}`;
    } catch (e) {
      status.textContent = "log: openLink error: " + (e?.message || e);
    }
  }

  async function loadNextPage() {
    if (loading || exhausted) return;
    loading = true;

    // Push skeletons just before the sentinel for visual continuity.
    const skel = skeletons(PAGE_SIZE);
    if (sentinel) grid.insertBefore(skel, sentinel);
    else grid.appendChild(skel);

    const startIndex = offset;
    status.textContent = `log: fetching offset=${offset}`;

    try {
      const url = `${API}?limit=${PAGE_SIZE}&offset=${offset}`;
      const r = await fetch(url, { headers: { "accept": "application/json" } });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      total = typeof data.count === "number" ? data.count : total;

      clearSkeletons();
      const results = Array.isArray(data.results) ? data.results : [];
      results.forEach((a, i) => {
        const card = renderCard(a, startIndex + i);
        if (sentinel) grid.insertBefore(card, sentinel);
        else grid.appendChild(card);
      });

      offset += results.length;
      if (results.length === 0 || offset >= total) {
        exhausted = true;
        showEnd();
      }
      status.textContent = `log: ok — ${offset}/${total}`;
    } catch (e) {
      clearSkeletons();
      showError(e?.message || String(e));
      status.textContent = "log: fetch error: " + (e?.message || e);
    } finally {
      loading = false;
    }
  }

  function showError(msg) {
    const div = document.createElement("div");
    div.className = "err";
    div.textContent = "Couldn't load more — " + msg;
    if (sentinel) grid.insertBefore(div, sentinel);
    else grid.appendChild(div);
  }

  function showEnd() {
    if (sentinel) sentinel.remove();
    sentinel = null;
    if (io) { io.disconnect(); io = null; }
    const end = document.createElement("div");
    end.className = "end";
    end.innerHTML = `You're all caught up.<br><button class="more" type="button">Start over</button>`;
    end.querySelector("button").addEventListener("click", () => {
      offset = 0; exhausted = false; total = Infinity;
      grid.innerHTML = "";
      mountSentinel();
      loadNextPage();
    });
    grid.appendChild(end);
  }

  function mountSentinel() {
    sentinel = document.createElement("div");
    sentinel.className = "sentinel";
    sentinel.innerHTML = `<span class="spinner" aria-hidden="true"></span>Loading more…`;
    grid.appendChild(sentinel);

    io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) loadNextPage();
      }
    }, { rootMargin: "400px 0px" });
    io.observe(sentinel);
  }

  // --- Connect --------------------------------------------------------------
  const app = new App({ name: "news-roll", version: "1.0.0" });
  app.onerror = (e) => { status.textContent = "log: error: " + (e?.message || e); };
  app.connect();

  mountSentinel();
  loadNextPage();
</script>
</body>
</html>
