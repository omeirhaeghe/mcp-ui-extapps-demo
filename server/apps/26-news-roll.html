<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>News Roll — MCP App</title>
  <style>
    :root { color-scheme: light dark;
      --fg:#0f172a; --muted:#64748b; --bg:#ffffff; --card:#ffffff;
      --border:#e5e7eb; --accent:#0ea5e9; --accent-2:#6366f1;
      --skel:#eef0f3; --chip:#f1f5f9;
      --shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.06);
      --shadow-lift: 0 2px 6px rgba(15,23,42,.08), 0 14px 30px rgba(14,165,233,.18); }
    @media (prefers-color-scheme: dark) { :root {
      --fg:#e5e7eb; --muted:#94a3b8; --bg:#0b0c0f; --card:#14161b;
      --border:#23262d; --accent:#38bdf8; --accent-2:#818cf8;
      --skel:#1c1f26; --chip:#1c2230;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
      --shadow-lift: 0 2px 6px rgba(0,0,0,.4), 0 14px 30px rgba(56,189,248,.22); } }

    html, body { margin:0; padding:0; color:var(--fg); background:var(--bg);
      font:14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

    .wrap { padding:16px 14px 22px; }
    .header { display:flex; align-items:center; justify-content:space-between;
      margin: 0 4px 12px; gap:12px; }
    .title h1 { margin:0; font-size:16px; font-weight:700; letter-spacing:-0.01em; }
    .title p  { margin:2px 0 0; color:var(--muted); font-size:12px; }
    .sponsored { display:inline-flex; align-items:center; gap:6px;
      padding:3px 9px; border-radius:999px; background: var(--chip);
      color: var(--muted); font-size:10px; font-weight:600; letter-spacing:.04em;
      text-transform:uppercase; border:1px solid var(--border); }
    .sponsored::before { content:""; width:6px; height:6px; border-radius:999px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); }

    .list { display:flex; flex-direction:column; gap:10px; }

    .card { position:relative; display:flex; gap:12px; align-items:stretch;
      background: var(--card); border:1px solid var(--border); border-radius:12px;
      overflow:hidden; box-shadow: var(--shadow); cursor:pointer; text-align:left;
      padding:0; width:100%; font: inherit; color: inherit;
      transition: transform .2s cubic-bezier(.2,.7,.2,1),
                  box-shadow .2s cubic-bezier(.2,.7,.2,1),
                  border-color .2s ease, background .2s ease; }
    .card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lift);
      border-color: transparent; background: var(--card); }
    .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .thumb { position:relative; flex: 0 0 132px; aspect-ratio: 4 / 3;
      background: var(--skel); overflow:hidden; align-self:stretch; }
    @media (max-width: 420px) { .thumb { flex-basis: 104px; } }
    .thumb img { width:100%; height:100%; object-fit:cover; display:block;
      opacity:0; transition: opacity .35s ease, transform .6s cubic-bezier(.2,.7,.2,1); }
    .thumb img.loaded { opacity:1; }
    .card:hover .thumb img.loaded { transform: scale(1.06); }
    .thumb .fallback { position:absolute; inset:0; display:flex; align-items:center;
      justify-content:center; font-size:28px; color: var(--muted);
      background: linear-gradient(135deg, var(--skel), var(--chip)); }

    .body { flex:1; min-width:0; padding:10px 12px 10px 4px;
      display:flex; flex-direction:column; justify-content:space-between; gap:6px; }
    .headline { margin:0; font-size:14px; font-weight:600; line-height:1.35;
      display:-webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow:hidden; }
    .summary { margin:0; font-size:12px; color: var(--muted); line-height:1.4;
      display:-webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow:hidden; }
    .meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap;
      color: var(--muted); font-size:11px; font-variant-numeric: tabular-nums; }
    .meta .src { font-weight:600; color: var(--fg); max-width: 14ch;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .meta .dot { width:3px; height:3px; border-radius:999px; background: currentColor;
      opacity:.6; }
    .meta .promo { color: var(--accent); font-weight:600; }

    /* Skeleton placeholders */
    .skeleton { display:flex; gap:12px; background: var(--card);
      border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .skeleton .thumb { flex: 0 0 132px; aspect-ratio: 4 / 3;
      background: linear-gradient(90deg, var(--skel) 0%, var(--chip) 50%, var(--skel) 100%);
      background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
    @media (max-width: 420px) { .skeleton .thumb { flex-basis: 104px; } }
    .skeleton .sk-body { flex:1; padding:12px 12px 12px 4px;
      display:flex; flex-direction:column; gap:8px; justify-content:center; }
    .skeleton .sk-line { height:10px; background: var(--skel); border-radius:4px; }
    .skeleton .sk-line.short { width:55%; }
    .skeleton .sk-line.tiny  { width:35%; height:8px; }
    @keyframes shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }

    .sentinel { padding:18px 0; display:flex; align-items:center;
      justify-content:center; gap:8px; color: var(--muted); font-size:12px; }
    .spinner { width:14px; height:14px; border:2px solid var(--border);
      border-top-color: var(--accent); border-radius:999px;
      animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg) } }

    .end { text-align:center; padding:18px 8px 6px; color: var(--muted); font-size:12px; }
    .end .more { display:inline-block; margin-top:6px; padding:7px 14px;
      border-radius:999px; border:1px solid var(--border); background: var(--card);
      color: var(--fg); cursor:pointer; font:600 12px inherit; }
    .end .more:hover { background: var(--bg); }

    .err { padding:14px; text-align:center; color:#dc2626; font-size:13px; }

    .status { color: var(--muted); font-size:11px; padding: 8px 4px 0;
      font-family: ui-monospace, monospace; min-height:14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">
        <h1>🐊 Florida Man Wire</h1>
        <p>Live from the Sunshine State. Scroll for more.</p>
      </div>
      <span class="sponsored">Only in Florida</span>
    </div>

    <div class="list" id="grid"></div>
    <div class="status" id="status">log: ready</div>
  </div>

<script type="module">
  import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@1.7.1/dist/src/app-with-deps.js";

  const PAGE_SIZE = 8;
  const PROXY = "https://wsrv.nl/?url=";
  const LANDING = "https://en.wikipedia.org/wiki/Florida_Man";

  // Curated fake Florida-Man headlines. We loop through these and apply a
  // rotating prefix ("Update:", "BREAKING:", …) on subsequent cycles so the
  // feed feels endless without ever showing the same exact card twice in a row.
  const STORIES = [
    { t: "Florida Man Tries to Pay Bar Tab With Live Alligator, Banned From Hooters",
      s: "Pensacola PD says the 3-foot reptile was returned to a nearby retention pond. The tab — $42 — remains unpaid.",
      src: "Pensacola Post" },
    { t: "Florida Woman Steals Police Cruiser to Make 4 AM Wawa Run",
      s: "She was caught after parking diagonally across two handicap spots. \"The lights were already on,\" she told officers.",
      src: "Sunshine Daily" },
    { t: "Florida Man Arrested for Selling Hurricane Insurance Outside Publix",
      s: "Policies covered \"acts of God, gators, and bad vibes.\" Underwriter was reportedly his cousin Reggie.",
      src: "Tampa Bay Tribune" },
    { t: "Florida Man Sues Walmart After Coconut Falls From Outdoor Display",
      s: "Suit seeks $3.2M in damages and one (1) replacement coconut. Walmart's lawyers are reportedly \"thinking about it.\"",
      src: "Orlando Observer" },
    { t: "Florida Man Rides Manatee Down Intracoastal, Cited for Reckless Sea-Cow Operation",
      s: "FWC says it's a first-of-its-kind charge. The manatee, named Gerald, was unharmed and is in stable condition.",
      src: "Gator Gazette" },
    { t: "Florida Woman Marries Tree in Sarasota, Files for Joint Tax Return",
      s: "The IRS has yet to respond. The tree, a 60-year-old live oak, declined to comment.",
      src: "Naples Nightly" },
    { t: "Florida Man Charged After Bringing Pet Iguana Into Magic Kingdom",
      s: "The iguana, named Sir Reginald, was wearing a Mickey ear hat. Disney security called it \"on-brand but not allowed.\"",
      src: "Orlando Observer" },
    { t: "Florida Man Refuses to Evacuate Hurricane, Surfs Storm Surge in Office Chair",
      s: "Posted the whole thing to TikTok. Survived. Got 2.4M views and a citation for \"reckless flotation.\"",
      src: "Panhandle Press" },
    { t: "Florida Man Crashes Golf Cart Through Drive-Thru, Demands McChicken",
      s: "Cart was registered to a retirement community in The Villages. He paid in nickels.",
      src: "Miami Mirror" },
    { t: "Florida Man Found Wearing Lobster Bib in Stranger's Aboveground Pool",
      s: "Was holding a wine glass full of ranch dressing. Refused to leave until the homeowner served crackers.",
      src: "Coastal Courier" },
    { t: "Florida Woman Hosts Yard Sale for Ex-Husband's Belongings — Charges Him Admission",
      s: "$5 at the door. He paid. He bought back his own bowling trophy for $40.",
      src: "Sunshine Daily" },
    { t: "Florida Man Steals Bulldozer to \"Make a Shortcut to Wendy's\"",
      s: "Shortcut was through three lanes of traffic and one Sherwin-Williams. He got the Baconator combo.",
      src: "Jacksonville Journal" },
    { t: "Florida Man Identifies as Pelican on Voter Registration Form",
      s: "Supervisor of Elections rejected it but noted the handwriting was \"impressively beak-like.\"",
      src: "Key West Chronicle" },
    { t: "Florida Man Caught Painting \"FOR SALE\" on Stranger's Cow",
      s: "Cow was already for sale. Owner was \"flattered but also pressing charges.\"",
      src: "Everglades Examiner" },
    { t: "Florida Man Mistakes Burmese Python for Garden Hose, Hospitalized",
      s: "The python is fine. Florida Man, in stable condition, says he \"should've known when it wouldn't unspool.\"",
      src: "Naples Nightly" },
    { t: "Florida Woman Calls 911 to Settle Pickleball Dispute",
      s: "Caller insisted the line judge was \"compromised.\" Officers ruled the ball out. She has appealed.",
      src: "Tampa Bay Tribune" },
    { t: "Florida Man Tries to Trade Beanie Baby Collection for Boat at Boat Show",
      s: "Offered a binder of 1998 Princess Diana bears. Boat dealer countered with \"absolutely not.\"",
      src: "Pensacola Post" },
    { t: "Florida Man Charged After Throwing Live Crab at Bouncer in Daytona",
      s: "Crab was unharmed. Bouncer was unimpressed. Florida Man pleaded \"crustacean self-defense.\"",
      src: "Panhandle Press" },
    { t: "Florida Man Surrenders to Police at 7-Eleven, Citing Lukewarm Slurpee Machine",
      s: "Turned himself in on outstanding warrants. Officers gave him a fresh Slurpee on the way to booking.",
      src: "Orlando Observer" },
    { t: "Florida Woman Performs Wedding Ceremony at Outback Steakhouse, Couple Sober",
      s: "Ceremony took place at table 12 between the Bloomin' Onion and the entrée. Officiant ordained on Tuesday.",
      src: "Sunshine Daily" },
    { t: "Florida Man Wins Sandcastle Contest Then Lists Castle on Zillow",
      s: "Asking $429,000, \"motivated seller.\" Tide came in before any showings. Listing now \"pending.\"",
      src: "Coastal Courier" },
    { t: "Florida Man Tries To Outrun Police on Lime Scooter, Battery Dies",
      s: "He'd been at 12% when the chase began. Arrested two blocks later. Scooter abandoned, still beeping.",
      src: "Miami Mirror" },
    { t: "Florida Man Steals Statue of Liberty Replica From Mini Golf Course",
      s: "It was on hole 7. He was found sleeping next to it in a Sonic parking lot. Both returned to play.",
      src: "Gator Gazette" },
    { t: "Florida Woman Brings Emotional-Support Capybara Through TSA",
      s: "Cleared security. Capybara, named Doug, ate a Cinnabon at Gate B14. Flight crew let him board.",
      src: "Tampa Bay Tribune" },
    { t: "Florida Man Caught Selling Boiled Peanuts Out of Trunk on Toll Road",
      s: "Was operating between exits 232 and 234. Health Dept. issued a fine. Reviews were \"actually pretty good.\"",
      src: "Jacksonville Journal" },
    { t: "Florida Man Builds Treehouse in Live Oak, Claims Squatter's Rights",
      s: "Tree is in a public park. City attorney says the doctrine \"does not apply to trees, sir.\"",
      src: "Everglades Examiner" },
    { t: "Florida Man Drives Through Hurricane Just to Beat Lunch Rush at Chick-fil-A",
      s: "Said \"the line is usually crazy.\" Got there in 12 minutes. Was the only customer. They were closed.",
      src: "Naples Nightly" },
    { t: "Florida Woman Caught Smuggling Live Lobster in Stroller at Disney",
      s: "Lobster was in a Baby Björn. Cast Members described the scene as \"surprisingly tender.\"",
      src: "Orlando Observer" },
    { t: "Florida Man Demands Refund From Atlantic Ocean for \"Too Salty\"",
      s: "Filed complaint with the Better Business Bureau. The Atlantic Ocean did not respond by press time.",
      src: "Key West Chronicle" },
    { t: "Florida Man Steals Cheese Wheel From Costco, Rolls It Home Six Miles",
      s: "$48 wheel of Manchego. Made it 5.8 miles before a deputy gave him a ride for the last 0.2.",
      src: "Sunshine Daily" },
  ];

  const PROMOS = ["Trending in FL", "Sponsored", "Hot takes", "Editor's pick", "Promoted"];
  const PREFIXES = ["", "UPDATE: ", "BREAKING: ", "MUST READ: ", "DEVELOPING: "];

  const grid = document.getElementById("grid");
  const status = document.getElementById("status");

  let loaded = 0;       // absolute count of rendered cards
  let loading = false;
  let io = null;
  let sentinel = null;

  function maybePromo(i) {
    return (i % 5 === 4) ? PROMOS[(i / 5 | 0) % PROMOS.length] : null;
  }

  function timeAgo(unixSec) {
    if (!Number.isFinite(unixSec)) return "";
    const s = Math.max(1, Date.now() / 1000 - unixSec | 0);
    if (s < 60) return s + "s ago";
    const m = s / 60 | 0;       if (m < 60) return m + "m ago";
    const h = m / 60 | 0;       if (h < 24) return h + "h ago";
    const d = h / 24 | 0;       if (d <  7) return d + "d ago";
    const w = d / 7 | 0;        if (w <  5) return w + "w ago";
    const mo = d / 30 | 0;      if (mo < 12) return mo + "mo ago";
    return (d / 365 | 0) + "y ago";
  }

  // Small deterministic hash — gives every story a stable seed for image,
  // age, score, and comment count without storing those fields in STORIES.
  function hash(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
    return Math.abs(h);
  }

  function proxyImg(url, w = 360, h = 270) {
    return PROXY + encodeURIComponent(url) +
      `&w=${w}&h=${h}&fit=cover&output=webp&q=80`;
  }

  // Pick the next story for absolute index i. Cycles through STORIES, with
  // a prefix that rotates each full cycle so identical titles never appear
  // back-to-back on the same screen.
  function storyAt(i) {
    const story = STORIES[i % STORIES.length];
    const cycle = (i / STORIES.length) | 0;
    const prefix = PREFIXES[cycle % PREFIXES.length];
    const seed = hash(story.t) + cycle * 7919;
    const ageMin = (seed % 1440) + cycle * 30;   // newer cycles → "older" headlines
    const score = 200 + (seed % 8000) - cycle * 50;
    const created = Date.now() / 1000 - ageMin * 60;

    return {
      title: prefix + story.t,
      summary: story.s,
      img: `https://picsum.photos/seed/fm-${seed}/360/270`,
      source: story.src,
      created,
      score: Math.max(12, score),
      url: LANDING,
    };
  }

  function skeletons(n) {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const s = document.createElement("div");
      s.className = "skeleton";
      s.dataset.role = "skel";
      s.innerHTML = `
        <div class="thumb"></div>
        <div class="sk-body">
          <div class="sk-line"></div>
          <div class="sk-line short"></div>
          <div class="sk-line tiny"></div>
        </div>`;
      frag.appendChild(s);
    }
    return frag;
  }
  function clearSkeletons() {
    grid.querySelectorAll('[data-role="skel"]').forEach(n => n.remove());
  }

  function renderCard(article, absIndex) {
    const card = document.createElement("button");
    card.className = "card";
    card.type = "button";
    card.dataset.url = article.url || "";

    const promo = maybePromo(absIndex);
    const ago = timeAgo(article.created);
    const imgSrc = proxyImg(article.img);

    card.innerHTML = `
      <div class="thumb">
        ${imgSrc
          ? `<img alt="" loading="lazy" referrerpolicy="no-referrer" decoding="async">
             <div class="fallback" style="display:none">🐊</div>`
          : `<div class="fallback">🐊</div>`}
      </div>
      <div class="body">
        <p class="headline"></p>
        <p class="summary"></p>
        <div class="meta">
          ${promo ? `<span class="promo">${promo}</span><span class="dot"></span>` : ""}
          <span class="src"></span><span class="dot"></span>
          <span class="ago"></span><span class="dot"></span>
          <span class="score"></span>
        </div>
      </div>
    `;

    card.querySelector(".headline").textContent = article.title;
    card.querySelector(".summary").textContent = article.summary
      || `From ${article.domain || article.source}`;
    card.querySelector(".src").textContent = article.source;
    card.querySelector(".ago").textContent = ago;
    card.querySelector(".score").textContent = `▲ ${article.score}`;

    const img = card.querySelector("img");
    if (img) {
      img.addEventListener("load", () => img.classList.add("loaded"));
      img.addEventListener("error", () => {
        img.remove();
        const fb = card.querySelector(".fallback");
        if (fb) fb.style.display = "flex";
      });
      img.src = imgSrc;
    }

    card.addEventListener("click", () => openArticle(article));
    return card;
  }

  async function openArticle(article) {
    if (!article.url) return;
    try {
      await app.openLink({ url: article.url });
      status.textContent = `log: openLink ok — ${article.source}`;
    } catch (e) {
      status.textContent = "log: openLink error: " + (e?.message || e);
    }
  }

  async function loadNextPage() {
    if (loading) return;
    loading = true;

    const skel = skeletons(PAGE_SIZE);
    if (sentinel) grid.insertBefore(skel, sentinel);
    else grid.appendChild(skel);

    const startIndex = loaded;
    status.textContent = `log: composing page (start=${startIndex})`;

    // Simulated network delay so skeletons flash briefly — feels like a real
    // infinite-scroll fetch. 250–550ms is the sweet spot.
    await new Promise(res => setTimeout(res, 250 + Math.random() * 300));

    clearSkeletons();
    for (let i = 0; i < PAGE_SIZE; i++) {
      const absIndex = startIndex + i;
      const article = storyAt(absIndex);
      const card = renderCard(article, absIndex);
      if (sentinel) grid.insertBefore(card, sentinel);
      else grid.appendChild(card);
    }
    loaded += PAGE_SIZE;
    status.textContent = `log: ok — ${loaded} stories rendered`;

    loading = false;
  }

  function showError(msg) {
    const div = document.createElement("div");
    div.className = "err";
    div.textContent = "Couldn't load more — " + msg;
    if (sentinel) grid.insertBefore(div, sentinel);
    else grid.appendChild(div);
  }

  function mountSentinel() {
    sentinel = document.createElement("div");
    sentinel.className = "sentinel";
    sentinel.innerHTML = `<span class="spinner" aria-hidden="true"></span>Loading more…`;
    grid.appendChild(sentinel);

    io = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) loadNextPage();
      }
    }, { rootMargin: "400px 0px" });
    io.observe(sentinel);
  }

  // --- Connect --------------------------------------------------------------
  const app = new App({ name: "news-roll", version: "1.0.0" });
  app.onerror = (e) => { status.textContent = "log: error: " + (e?.message || e); };
  app.connect();

  mountSentinel();
  loadNextPage();
</script>
</body>
</html>
