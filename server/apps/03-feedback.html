<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Feedback — MCP App</title>
  <style>
    :root { color-scheme: light dark;
      --fg:#111827; --muted:#6b7280; --bg:#ffffff; --card:#ffffff;
      --border:#e5e7eb; --border-strong:#d1d5db;
      --chip-bg:#ffffff; --chip-fg:#1f2937;
      --chip-bg-on:#1f2937; --chip-fg-on:#ffffff;
      --accent:#7c3aed; --accent-press:#6d28d9;
      --field-bg:#ffffff; --good:#16a34a; }
    @media (prefers-color-scheme: dark) { :root {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#0b0c0f; --card:#16181d;
      --border:#23262d; --border-strong:#2f3340;
      --chip-bg:#1b1d23; --chip-fg:#e5e7eb;
      --chip-bg-on:#e5e7eb; --chip-fg-on:#0b0c0f;
      --accent:#a78bfa; --accent-press:#8b5cf6;
      --field-bg:#0f1115; --good:#22c55e; } }

    html, body { margin:0; padding:0; color:var(--fg); background:transparent;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

    .card { margin:14px; padding:20px 22px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px -8px rgba(0,0,0,.08); }

    .head { display:flex; align-items:flex-start; gap:12px; }
    .head .title { flex:1; min-width:0; }
    h1 { margin:0 0 4px; font-size:16px; font-weight:600; letter-spacing:-0.005em; }
    .sub { margin:0; color: var(--muted); font-size:12.5px; line-height:1.4; }

    .close { flex:0 0 auto; width:28px; height:28px; border-radius:8px;
      background:transparent; border:1px solid transparent;
      color: var(--muted); cursor:pointer; font: inherit; font-size:18px;
      line-height:1; display:inline-flex; align-items:center; justify-content:center; }
    .close:hover { background: color-mix(in oklab, var(--fg) 6%, transparent);
      color: var(--fg); }

    .chips { display:flex; flex-wrap:wrap; gap:8px; margin: 16px 0 4px; }
    .chip { display:inline-flex; align-items:center;
      padding: 7px 13px; border-radius:999px;
      background: var(--chip-bg); color: var(--chip-fg);
      border: 1px solid var(--border-strong);
      font-size: 12.5px; cursor:pointer; user-select:none;
      transition: background .15s ease, color .15s ease, border-color .15s ease; }
    .chip:hover { background: color-mix(in oklab, var(--chip-fg) 6%, var(--chip-bg)); }
    .chip.on { background: var(--chip-bg-on); color: var(--chip-fg-on);
      border-color: var(--chip-bg-on); }

    .harmful { margin-top: 14px; }
    .harmful-toggle { display:inline-flex; align-items:center; gap:6px;
      background:transparent; border:none; color: var(--fg);
      padding: 4px 0; font: inherit; font-size: 13px; cursor:pointer; }
    .harmful-toggle .chev { display:inline-block; transition: transform .2s ease;
      color: var(--muted); font-size: 11px; }
    .harmful.open .chev { transform: rotate(90deg); }
    .harmful-body { display:none; margin-top: 10px; }
    .harmful.open .harmful-body { display:block; }

    .details { margin-top: 16px; }
    textarea { width: 100%; box-sizing: border-box; min-height: 78px;
      padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border-strong); background: var(--field-bg);
      color: var(--fg); font: inherit; font-size: 13px; resize: vertical; }
    textarea::placeholder { color: var(--muted); }
    textarea:focus { outline: none; border-color: var(--accent); }

    .row-logs { display:flex; align-items:center; gap:8px; margin-top: 14px;
      font-size: 13px; color: var(--fg); }
    .row-logs input[type="checkbox"] { width:16px; height:16px; cursor:pointer; }

    .actions { margin-top: 16px; }
    button.submit { background: var(--accent); color:#fff; border:none;
      padding: 9px 22px; border-radius: 999px; font: inherit; font-size: 13px;
      font-weight: 600; cursor: pointer; }
    button.submit:hover { background: var(--accent-press); }
    button.submit[disabled] { opacity:.55; cursor:not-allowed; }

    .done { display:none; padding: 28px 12px; text-align:center;
      color: var(--good); font-size: 14px; }
    .done.visible { display:block; }

    .log { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border);
      color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace;
      min-height: 14px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="head">
      <div class="title">
        <h1>What didn't you like about this response?</h1>
        <p class="sub">Your feedback helps improve responses for everyone</p>
      </div>
      <button class="close" id="close" type="button" aria-label="Dismiss">&times;</button>
    </div>

    <form id="form">
      <div class="chips" id="chips" role="group" aria-label="Reasons">
        <button type="button" class="chip" data-v="incorrect">Incorrect</button>
        <button type="button" class="chip" data-v="incomplete">Incomplete</button>
        <button type="button" class="chip" data-v="irrelevant">Irrelevant</button>
        <button type="button" class="chip" data-v="slow_or_buggy">Slow or buggy</button>
        <button type="button" class="chip" data-v="too_long">Too long</button>
        <button type="button" class="chip" data-v="too_short">Too short</button>
        <button type="button" class="chip" data-v="other">Other</button>
      </div>

      <div class="harmful" id="harmful">
        <button class="harmful-toggle" id="harmful-toggle" type="button"
                aria-expanded="false">
          <span class="chev">›</span>
          <span>Harmful or inappropriate</span>
        </button>
        <div class="harmful-body">
          <div class="chips" id="harmful-chips" role="group" aria-label="Harmful categories">
            <button type="button" class="chip" data-v="hate">Hate speech</button>
            <button type="button" class="chip" data-v="violence">Violence</button>
            <button type="button" class="chip" data-v="sexual">Sexually explicit</button>
            <button type="button" class="chip" data-v="dangerous">Dangerous advice</button>
            <button type="button" class="chip" data-v="other_harmful">Other</button>
          </div>
        </div>
      </div>

      <div class="details">
        <textarea id="text" placeholder="Would you like to share more details? (optional)"></textarea>
      </div>

      <label class="row-logs">
        <input type="checkbox" id="send-logs">
        <span>Send logs with the response</span>
      </label>

      <div class="actions">
        <button type="submit" class="submit" id="submit" disabled>Submit</button>
      </div>
    </form>

    <div class="done" id="done">✓ Thanks — your feedback was sent.</div>
    <div class="log" id="log">log: ready</div>
  </div>

<script type="module">
  import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@1.7.1/dist/src/app-with-deps.js";

  const log = document.getElementById('log');
  const submit = document.getElementById('submit');
  const form = document.getElementById('form');
  const done = document.getElementById('done');

  const selected = new Set();
  const harmfulSelected = new Set();

  function refreshSubmit() {
    submit.disabled = selected.size === 0 && harmfulSelected.size === 0
      && document.getElementById('text').value.trim() === '';
  }

  function wireChipGroup(container, store) {
    container.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const v = chip.dataset.v;
        if (store.has(v)) { store.delete(v); chip.classList.remove('on'); }
        else { store.add(v); chip.classList.add('on'); }
        refreshSubmit();
      });
    });
  }
  wireChipGroup(document.getElementById('chips'), selected);
  wireChipGroup(document.getElementById('harmful-chips'), harmfulSelected);

  const harmful = document.getElementById('harmful');
  document.getElementById('harmful-toggle').addEventListener('click', () => {
    const open = harmful.classList.toggle('open');
    document.getElementById('harmful-toggle').setAttribute('aria-expanded', String(open));
  });

  document.getElementById('text').addEventListener('input', refreshSubmit);

  const app = new App({ name: "feedback-widget", version: "1.0.0" });
  app.onerror = (e) => { log.textContent = 'log: error: ' + (e?.message || e); };

  document.getElementById('close').addEventListener('click', async () => {
    try { await app.requestTeardown({ reason: "user-dismissed" }); }
    catch { /* host may not support it */ }
  });

  function summarize(reasons, harmful, details) {
    const bits = [];
    if (reasons.length) bits.push(reasons.join(", "));
    if (harmful.length) bits.push("harmful: " + harmful.join(", "));
    if (details) bits.push(`"${details}"`);
    return bits.length ? bits.join(" · ") : "no specific reasons";
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const details = document.getElementById('text').value.trim();
    const send_logs = document.getElementById('send-logs').checked;
    const reasons = [...selected];
    const harmful_reasons = [...harmfulSelected];
    form.style.display = 'none';
    done.classList.add('visible');
    try {
      await app.callServerTool({
        name: "submit_feedback",
        arguments: { reasons, harmful_reasons, details, send_logs },
      });
      log.textContent = 'log: submit_feedback ok';
    } catch (err) {
      log.textContent = 'log: submit_feedback error: ' + (err?.message || err);
      return;
    }
    try {
      await app.sendMessage({
        role: "user",
        content: [{
          type: "text",
          text: "I just sent feedback on the last response — "
                + summarize(reasons, harmful_reasons, details) + ".",
        }],
      });
    } catch { /* host may not support ui/message */ }
  });

  app.connect();
</script>
</body>
</html>
