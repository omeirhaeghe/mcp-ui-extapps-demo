<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Embed URL — MCP App</title>
  <style>
    :root { color-scheme: light dark;
      --fg:#1a1a1a; --muted:#6b7280; --bg:#fff; --card:#f7f7f8;
      --border:#e5e7eb; --accent:#2563eb; --btn:#e5e7eb; --btn-fg:#111;
      --good:#10b981; --warn:#f59e0b; --bad:#ef4444; }
    @media (prefers-color-scheme: dark) { :root {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#0b0c0f; --card:#16181d;
      --border:#23262d; --accent:#7aa2ff; --btn:#23262d; --btn-fg:#e5e7eb; } }
    html,body { margin:0; padding:0; color:var(--fg); background:var(--bg);
      font:14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .wrap { margin:14px; background:var(--card); border:1px solid var(--border);
      border-radius:10px; overflow:hidden; }
    .urlbar { display:flex; gap:6px; align-items:center; padding:8px 10px;
      border-bottom:1px solid var(--border); }
    .urlbar input { flex:1; padding:6px 10px; background:var(--bg);
      border:1px solid var(--border); border-radius:5px; color:var(--fg);
      font: 12px ui-monospace, monospace; }
    .urlbar button { background:var(--btn); color:var(--btn-fg);
      border:1px solid var(--border); border-radius:5px; padding:5px 10px;
      font-size:12px; cursor:pointer; font-family:inherit; }
    .urlbar button.primary { background:var(--accent); color:#fff; border-color:transparent; }
    .badge { font-size:10px; padding:2px 8px; border-radius:999px;
      background:var(--btn); color:var(--btn-fg);
      font-family: ui-monospace, monospace; }
    .badge.ok   { background:#10b98122; color:var(--good); }
    .badge.warn { background:#f59e0b22; color:var(--warn); }
    .badge.bad  { background:#ef444422; color:var(--bad); }

    .frame-host { position:relative; height: 480px; background:var(--bg); }
    iframe.target { width:100%; height:100%; border:0; display:block; }
    .overlay { position:absolute; inset:0; padding:20px;
      display:none; flex-direction:column; gap:10px; align-items:center;
      justify-content:center; text-align:center; background:var(--card);
      color:var(--muted); }
    .overlay.visible { display:flex; }
    .overlay h2 { margin:0; font-size:14px; color:var(--fg); }
    .overlay p { margin:0; font-size:12px; max-width:360px; }
    .overlay code { font-family: ui-monospace, monospace; font-size:11px;
      background:var(--btn); color:var(--btn-fg); padding:1px 6px;
      border-radius:4px; }

    .footer { padding:10px 12px; border-top:1px solid var(--border);
      display:flex; flex-wrap:wrap; gap:6px; align-items:center;
      font-size:11px; color:var(--muted); }
    .pill { padding:2px 8px; border-radius:999px;
      background:var(--btn); color:var(--btn-fg);
      font-family: ui-monospace, monospace; font-size:10px;
      cursor:pointer; user-select:none; }
    .pill:hover { filter: brightness(1.05); }
    .log { margin-left:auto; font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="urlbar">
      <span class="badge" id="status-badge">…</span>
      <input id="url" type="text" spellcheck="false" autocomplete="off">
      <button id="reload">Reload</button>
      <button id="open" class="primary">Open ↗</button>
    </div>

    <div class="frame-host">
      <iframe class="target" id="frame"
        sandbox="allow-scripts allow-forms allow-popups"
        referrerpolicy="no-referrer"
        loading="eager"></iframe>
      <div class="overlay" id="overlay">
        <h2 id="overlay-title">Could not frame this URL</h2>
        <p id="overlay-body">Most sites refuse framing via <code>X-Frame-Options</code> /
           <code>Content-Security-Policy: frame-ancestors</code>.</p>
        <p>Use the <strong>Open ↗</strong> button to open it in a new tab.</p>
      </div>
    </div>

    <div class="footer">
      <span>Try:</span>
      <span class="pill" data-url="https://example.com">example.com</span>
      <span class="pill" data-url="https://example.org">example.org</span>
      <span class="pill" data-url="https://www.openstreetmap.org/export/embed.html?bbox=2.27,48.83,2.42,48.89">OSM embed</span>
      <span class="pill" data-url="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ">YT embed</span>
      <span class="log" id="log">log: ready</span>
    </div>
  </div>

<script type="module">
  import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@1.7.1/dist/src/app-with-deps.js";

  // Mirror of the server's _meta.ui.csp.frameDomains. Used purely for the
  // pre-flight badge — the host is the actual gatekeeper at the CSP level.
  const ALLOWED_ORIGINS = [
    "https://example.com",
    "https://example.org",
    "https://www.openstreetmap.org",
    "https://www.youtube-nocookie.com",
    "https://www.wikipedia.org",
    "https://*.github.io",
  ];

  const urlInput  = document.getElementById('url');
  const frame     = document.getElementById('frame');
  const overlay   = document.getElementById('overlay');
  const ovTitle   = document.getElementById('overlay-title');
  const ovBody    = document.getElementById('overlay-body');
  const badge     = document.getElementById('status-badge');
  const reloadBtn = document.getElementById('reload');
  const openBtn   = document.getElementById('open');
  const log       = document.getElementById('log');
  const pills     = document.querySelectorAll('.pill[data-url]');

  function originAllowed(rawUrl) {
    let parsed;
    try { parsed = new URL(rawUrl); } catch { return false; }
    const o = parsed.origin;
    const host = parsed.hostname;
    return ALLOWED_ORIGINS.some(rule => {
      if (rule === o) return true;
      if (rule.startsWith("https://*.")) {
        const suffix = rule.slice("https://*.".length);
        return host === suffix || host.endsWith("." + suffix);
      }
      return false;
    });
  }

  function setBadge(state, text) {
    badge.className = 'badge ' + state;
    badge.textContent = text;
  }

  function showOverlay(title, body) {
    ovTitle.textContent = title;
    if (body) ovBody.textContent = body;
    overlay.classList.add('visible');
  }
  function hideOverlay() { overlay.classList.remove('visible'); }

  let loadTimer = null;
  let didLoad = false;

  function load(url) {
    didLoad = false;
    hideOverlay();
    if (!url) {
      setBadge('warn', 'no url');
      log.textContent = 'log: empty url';
      return;
    }
    if (!originAllowed(url)) {
      setBadge('bad', 'blocked');
      showOverlay(
        "Origin not in frameDomains",
        "This widget only allowlists a few demo origins. " +
        "Click Open ↗ to open the URL externally."
      );
      log.textContent = 'log: ' + url + ' — origin not in frameDomains';
      return;
    }
    setBadge('warn', 'loading…');
    frame.src = url;
    // X-Frame-Options blocks fire neither `load` nor `error` reliably;
    // we time out and check.
    clearTimeout(loadTimer);
    loadTimer = setTimeout(() => {
      if (!didLoad) {
        setBadge('bad', 'X-Frame-Options?');
        showOverlay(
          "The target site refused framing",
          "It probably set X-Frame-Options: DENY or " +
          "Content-Security-Policy: frame-ancestors. " +
          "Click Open ↗ to view it in a new tab."
        );
      }
    }, 4500);
  }

  frame.addEventListener('load', () => {
    didLoad = true;
    clearTimeout(loadTimer);
    setBadge('ok', 'framed');
    hideOverlay();
    log.textContent = 'log: loaded ' + frame.src;
  });

  reloadBtn.addEventListener('click', () => load(urlInput.value.trim()));
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') load(urlInput.value.trim());
  });
  pills.forEach(p => p.addEventListener('click', () => {
    urlInput.value = p.dataset.url;
    load(p.dataset.url);
  }));

  const app = new App({ name: "embed-url-widget", version: "1.0.0" });

  openBtn.addEventListener('click', async () => {
    const url = urlInput.value.trim();
    if (!url) return;
    try {
      await app.openLink({ url });
    } catch (err) {
      log.textContent = 'openLink error: ' + (err?.message || err);
    }
  });

  app.ontoolinput = (params) => {
    const args = params.arguments || {};
    const url = (args.url || "https://example.com").trim();
    urlInput.value = url;
    load(url);
  };

  app.connect().then(() => {
    if (!urlInput.value) {
      urlInput.value = "https://example.com";
      load(urlInput.value);
    }
  });
</script>
</body>
</html>
