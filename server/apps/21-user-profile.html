<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>User profile — MCP App</title>
  <style>
    :root { color-scheme: light dark;
      --fg:#1a1a1a; --muted:#6b7280; --bg:#fff; --card:#f7f7f8;
      --border:#e5e7eb; --accent:#2563eb; --btn:#e5e7eb; --btn-fg:#111;
      --good:#16a34a; }
    @media (prefers-color-scheme: dark) { :root {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#0b0c0f; --card:#16181d;
      --border:#23262d; --accent:#7aa2ff; --btn:#23262d; --btn-fg:#e5e7eb;
      --good:#22c55e; } }
    html,body { margin:0; padding:0; color:var(--fg); background:var(--bg);
      font:14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    .card { margin:16px; padding:18px 20px; background:var(--card);
      border:1px solid var(--border); border-radius:10px; }
    h1 { margin:0 0 4px; font-size:16px; }
    .sub { margin:0 0 14px; color:var(--muted); font-size:12px; }
    label { display:block; font-size:12px; color:var(--muted);
      margin: 10px 0 6px; }
    input[type=text], select { width:100%; box-sizing:border-box; padding:8px 10px;
      background:var(--bg); border:1px solid var(--border); border-radius:6px;
      color:var(--fg); font: inherit; }
    .row { display:flex; gap:8px; margin-top:14px; align-items:center; }
    button { background:var(--btn); color:var(--btn-fg); border:1px solid var(--border);
      padding:8px 14px; border-radius:6px; font-size:13px; cursor:pointer;
      font-family: inherit; }
    button.primary { background:var(--accent); color:#fff; border-color:transparent; }
    button[disabled] { opacity:0.5; cursor:not-allowed; }
    .preview { margin-top:14px; padding:10px 12px; background:var(--bg);
      border:1px dashed var(--border); border-radius:6px; font-size:12px;
      white-space:pre-wrap; font-family:ui-monospace, monospace; color:var(--muted); }
    .preview .heading { color:var(--fg); font-weight:600; margin-bottom:4px;
      font-family: inherit; font-size:11px; text-transform:uppercase;
      letter-spacing:0.04em; }
    .ok { color:var(--good); }
    .log { margin-top:12px; padding-top:12px; border-top:1px solid var(--border);
      color:var(--muted); font-size:11px; font-family:ui-monospace, monospace; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <h1>User profile</h1>
    <p class="sub">Tests <code>updateModelContext</code> — pushes preferences into the model's context for future turns.</p>

    <form id="form">
      <label for="name">Preferred name</label>
      <input type="text" id="name" placeholder="e.g. Jamie" autocomplete="off">

      <label for="units">Units</label>
      <select id="units">
        <option value="metric">Metric (km, °C, kg)</option>
        <option value="imperial">Imperial (mi, °F, lb)</option>
      </select>

      <label for="style">Reply style</label>
      <select id="style">
        <option value="concise">Concise — bullet points, minimal prose</option>
        <option value="detailed">Detailed — full explanations</option>
        <option value="playful">Playful — informal tone</option>
      </select>

      <div class="row">
        <button type="submit" class="primary" id="submit">Update model context</button>
      </div>
    </form>

    <div class="preview" id="preview">
      <div class="heading">What the model will see</div>
      <span id="preview-body">Fill the form and submit to push these into the model's context.</span>
    </div>

    <div class="log" id="log">log: ready</div>
  </div>

<script type="module">
  import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@1.7.1/dist/src/app-with-deps.js";

  const log = document.getElementById('log');
  const previewBody = document.getElementById('preview-body');

  const app = new App({ name: "user-profile-widget", version: "1.0.0" });
  app.onerror = (e) => { log.textContent = 'log: error: ' + (e?.message || e); };

  function buildContextText({ name, units, style }) {
    const lines = ['User preferences:'];
    if (name) lines.push(`- Preferred name: ${name}`);
    lines.push(`- Units: ${units}`);
    lines.push(`- Reply style: ${style}`);
    return lines.join('\n');
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const units = document.getElementById('units').value;
    const style = document.getElementById('style').value;

    const text = buildContextText({ name, units, style });
    previewBody.textContent = text;

    try {
      await app.updateModelContext({
        content: [{ type: "text", text }],
        structuredContent: { name: name || null, units, style },
      });
      log.innerHTML = '<span class="ok">log: updateModelContext ok</span>';
    } catch (err) {
      log.textContent = 'log: updateModelContext error: ' + (err?.message || err);
    }
  });

  app.connect();
</script>
</body>
</html>
