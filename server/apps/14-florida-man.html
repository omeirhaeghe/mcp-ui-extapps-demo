<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Florida Man — MCP App</title>
  <style>
    :root { color-scheme: light dark;
      --fg:#1a1a1a; --muted:#6b7280; --bg:#fff; --card:#f7f7f8;
      --border:#e5e7eb; --accent:#16a34a; --bad:#dc2626;
      --grass:#86efac; --road:#374151; --goal:#fde68a; --line:#fde047; }
    @media (prefers-color-scheme: dark) { :root {
      --fg:#e5e7eb; --muted:#9ca3af; --bg:#0b0c0f; --card:#16181d;
      --border:#23262d; --accent:#22c55e; --bad:#f87171;
      --grass:#15803d; --road:#1f2937; --goal:#a16207; --line:#fbbf24; } }
    html,body { margin:0; padding:0; color:var(--fg); background:var(--bg);
      font:14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      user-select: none; -webkit-user-select: none; }
    .card { margin:14px; padding:14px; background:var(--card);
      border:1px solid var(--border); border-radius:10px; }
    .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
    .title { font-size:16px; font-weight:600; }
    .stats { display:flex; gap:14px; font-size:12px; color: var(--muted); }
    .stats b { color: var(--fg); font-variant-numeric: tabular-nums; }

    .stage { position:relative; width:100%; aspect-ratio: 9 / 7;
      background:#000; border-radius:10px; overflow:hidden;
      border: 1px solid var(--border); outline:none; }
    canvas { display:block; width:100%; height:100%; image-rendering: pixelated; }
    .overlay { position:absolute; inset:0; display:none;
      align-items:center; justify-content:center; flex-direction:column;
      background: rgba(0,0,0,0.6); color:#fff; gap:10px; padding:14px;
      text-align:center; }
    .overlay.show { display:flex; }
    .overlay .big { font-size: 22px; font-weight: 700; }
    .overlay .sub { font-size: 13px; opacity: 0.85; }
    .overlay button { background:var(--accent); color:#fff; border:0;
      border-radius:6px; padding:8px 16px; font-size:13px; cursor:pointer;
      font-family: inherit; }

    .pad { display:grid; grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr); gap: 6px; max-width: 180px;
      margin: 12px auto 4px; aspect-ratio: 1; }
    .pad button { background: var(--bg); color: var(--fg);
      border: 1px solid var(--border); border-radius: 8px;
      font-size: 18px; cursor: pointer; font-family: inherit;
      touch-action: manipulation; }
    .pad button:active { background: var(--accent); color: #fff; }
    .pad .b-up   { grid-column: 2; grid-row: 1; }
    .pad .b-left { grid-column: 1; grid-row: 2; }
    .pad .b-down { grid-column: 2; grid-row: 3; }
    .pad .b-right{ grid-column: 3; grid-row: 2; }
    .footer { color: var(--muted); font-size:11px; text-align:center; margin-top:6px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="title">Florida Man crossing 🤠</div>
      <div class="stats">
        Score <b id="score">0</b> · Best <b id="best">0</b> · Lives <b id="lives">3</b>
      </div>
    </div>

    <div class="stage" id="stage" tabindex="0">
      <canvas id="cv" width="360" height="280"></canvas>
      <div class="overlay" id="overlay">
        <div class="big" id="ovTitle">Press Start</div>
        <div class="sub" id="ovSub">Cross to the alligator zone. Don't get hit.</div>
        <button id="startBtn">Start</button>
      </div>
    </div>

    <div class="pad" aria-hidden="false">
      <button class="b-up"    data-dir="up"    aria-label="Up">↑</button>
      <button class="b-left"  data-dir="left"  aria-label="Left">←</button>
      <button class="b-down"  data-dir="down"  aria-label="Down">↓</button>
      <button class="b-right" data-dir="right" aria-label="Right">→</button>
    </div>
    <div class="footer">Arrow keys / WASD on desktop · D-pad on mobile.</div>
  </div>

<script type="module">
  import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@1.7.1/dist/src/app-with-deps.js";

  const W = 360, H = 280;
  const ROWS = 5;            // start, lane, lane, lane, goal
  const ROW_H = H / ROWS;    // 56
  const COLS = 9;
  const COL_W = W / COLS;    // 40

  const cv  = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const stage   = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovSub   = document.getElementById('ovSub');
  const startBtn= document.getElementById('startBtn');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const livesEl = document.getElementById('lives');

  let score = 0, best = 0, lives = 3;
  let running = false, dead = false;
  // Player position in pixels (centered on a column).
  let px = (COLS >> 1) * COL_W + COL_W / 2;
  let py = (ROWS - 1) * ROW_H + ROW_H / 2;
  let lastT = 0;

  // 3 lanes of golf carts (rows 1..3 from top of stage; row 0 is goal, row 4 is start).
  const LANES = [
    { row: 1, dir: +1, speed: 70, gap: 130 }, // top lane: rightward, slow
    { row: 2, dir: -1, speed: 95, gap: 110 }, // middle: leftward, medium
    { row: 3, dir: +1, speed: 130, gap: 100 }, // bottom: rightward, fast
  ];
  let carts = [];
  function spawnCarts() {
    carts = [];
    for (const lane of LANES) {
      // Lay out a few carts evenly across with small jitter.
      const count = Math.ceil((W + lane.gap) / lane.gap);
      for (let i = 0; i < count; i++) {
        carts.push({
          lane,
          x: (i * lane.gap) + (Math.random() * 16 - 8),
          y: lane.row * ROW_H + ROW_H / 2,
        });
      }
    }
  }

  function setLives(n) { lives = n; livesEl.textContent = String(n); }
  function setScore(n) { score = n; scoreEl.textContent = String(n); }
  function showOverlay(title, sub, btnLabel) {
    ovTitle.textContent = title;
    ovSub.textContent = sub;
    startBtn.textContent = btnLabel || 'Start';
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }

  function draw() {
    // Rows.
    ctx.fillStyle = getCSS('--grass'); ctx.fillRect(0, (ROWS - 1) * ROW_H, W, ROW_H);
    ctx.fillStyle = getCSS('--goal');  ctx.fillRect(0, 0, W, ROW_H);
    ctx.fillStyle = getCSS('--road');  ctx.fillRect(0, ROW_H, W, ROW_H * 3);
    // Dashed lane dividers.
    ctx.strokeStyle = getCSS('--line');
    ctx.setLineDash([10, 8]);
    ctx.lineWidth = 2;
    for (let r = 2; r <= 3; r++) {
      ctx.beginPath();
      ctx.moveTo(0, r * ROW_H);
      ctx.lineTo(W, r * ROW_H);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // Goal markers (alligators).
    ctx.font = '24px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < 4; i++) {
      ctx.fillText('🐊', (i * 2 + 1) * COL_W + COL_W / 2, ROW_H / 2);
    }

    // Carts.
    ctx.font = '28px sans-serif';
    for (const c of carts) {
      // Use 🛺 (rickshaw) — closest emoji to a golf cart.
      ctx.fillText('🛺', c.x, c.y);
    }

    // Player.
    ctx.font = '28px sans-serif';
    ctx.fillText(dead ? '💥' : '🤠', px, py);
  }

  function getCSS(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function row(y) { return Math.floor(y / ROW_H); }

  function checkCollisions() {
    // Player rect ~28px; cart rect ~32px. Use tighter ~22 for forgiveness.
    const pr = row(py);
    if (pr < 1 || pr > 3) return false; // safe rows
    for (const c of carts) {
      if (Math.abs(c.x - px) < 24 && Math.abs(c.y - py) < 18) return true;
    }
    return false;
  }

  function loop(t) {
    if (!lastT) lastT = t;
    const dt = Math.min(0.1, (t - lastT) / 1000);
    lastT = t;

    if (running) {
      // Move carts.
      for (const c of carts) {
        c.x += c.lane.dir * c.lane.speed * dt;
        // Wrap.
        if (c.lane.dir > 0 && c.x > W + 30) c.x = -30;
        if (c.lane.dir < 0 && c.x < -30)    c.x = W + 30;
      }
      // Collision.
      if (!dead && checkCollisions()) hit();
      // Reach goal.
      if (!dead && py < ROW_H) cross();
    }
    draw();
    requestAnimationFrame(loop);
  }

  function hit() {
    dead = true;
    setLives(lives - 1);
    if (lives <= 0) {
      running = false;
      best = Math.max(best, score);
      bestEl.textContent = String(best);
      showOverlay('Game over 💥', 'Final score: ' + score + '. Best: ' + best + '.', 'Play again');
      // Fire-and-forget score callback.
      app.callServerTool({
        name: "record_florida_score",
        arguments: { crossings: score, deaths: 3 },
      }).catch((e) => console.warn('record_florida_score failed:', e));
      return;
    }
    setTimeout(() => { dead = false; resetPlayer(); }, 700);
  }

  function cross() {
    setScore(score + 1);
    if (score > best) { best = score; bestEl.textContent = String(best); }
    resetPlayer();
  }

  function resetPlayer() {
    px = (COLS >> 1) * COL_W + COL_W / 2;
    py = (ROWS - 1) * ROW_H + ROW_H / 2;
  }

  function move(dir) {
    if (!running || dead) return;
    if (dir === 'up')    py = Math.max(ROW_H / 2,        py - ROW_H);
    if (dir === 'down')  py = Math.min((ROWS - 1) * ROW_H + ROW_H / 2, py + ROW_H);
    if (dir === 'left')  px = Math.max(COL_W / 2,        px - COL_W);
    if (dir === 'right') px = Math.min((COLS - 1) * COL_W + COL_W / 2, px + COL_W);
  }

  function start() {
    setScore(0); setLives(3); dead = false; running = true;
    resetPlayer(); spawnCarts(); hideOverlay();
    stage.focus();
  }

  startBtn.addEventListener('click', start);

  document.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup','w'].includes(k))    { move('up');    e.preventDefault(); }
    if (['arrowdown','s'].includes(k))  { move('down');  e.preventDefault(); }
    if (['arrowleft','a'].includes(k))  { move('left');  e.preventDefault(); }
    if (['arrowright','d'].includes(k)) { move('right'); e.preventDefault(); }
  });
  document.querySelectorAll('.pad button').forEach(b => {
    b.addEventListener('click', () => move(b.dataset.dir));
  });

  spawnCarts();
  showOverlay('Florida Man Crossing', 'Use arrows / WASD or the D-pad. Reach the alligator zone.', 'Start');

  const app = new App({ name: "florida-man-widget", version: "1.0.0" });
  app.connect();
  requestAnimationFrame(loop);
</script>
</body>
</html>
