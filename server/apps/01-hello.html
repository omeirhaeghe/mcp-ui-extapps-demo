<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello — MCP-UI</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --bg: #ffffff;
      --card: #f7f7f8;
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --bg: #0b0c0f;
        --card: #16181d;
        --border: #23262d;
        --accent: #7aa2ff;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    .card {
      margin: 16px;
      padding: 20px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p { margin: 0; color: var(--muted); font-size: 13px; }
    .meta { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
            color: var(--muted); font-size: 11px; }
    .accent { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, <span class="accent">{{NAME}}</span> 👋</h1>
    <p>This is the simplest possible MCP-UI ext-app — static HTML, no scripts.</p>
    <div class="meta">
      Resource type <code>EmbeddedResource</code> · MIME <code>text/html</code> · Rendered {{TIMESTAMP}}
    </div>
  </div>
</body>
</html>
