<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello — MCP App</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --bg: #ffffff;
      --card: #f7f7f8;
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --bg: #0b0c0f;
        --card: #16181d;
        --border: #23262d;
        --accent: #7aa2ff;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    .card {
      margin: 16px;
      padding: 20px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p { margin: 0; color: var(--muted); font-size: 13px; }
    .meta { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
            color: var(--muted); font-size: 11px; }
    .accent { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, <span id="name" class="accent">world</span> 👋</h1>
    <p>Built on the official MCP Apps SDK. Resource <code>ui://hello</code>.</p>
    <div class="meta">MIME <code>text/html;profile=mcp-app</code> · Rendered <span id="ts">just now</span></div>
  </div>

  <script type="module">
    import { App } from "https://cdn.jsdelivr.net/npm/@modelcontextprotocol/ext-apps@1.7.1/dist/src/app-with-deps.js";
    const app = new App({ name: "hello-widget", version: "1.0.0" });
    app.ontoolinput = (params) => {
      const args = params.arguments || {};
      if (args.name) document.getElementById("name").textContent = args.name;
      document.getElementById("ts").textContent = new Date().toLocaleTimeString();
    };
    app.connect();
  </script>
</body>
</html>
