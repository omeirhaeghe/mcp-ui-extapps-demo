<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello — MCP-UI</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1a1a1a;
      --muted: #6b7280;
      --bg: #ffffff;
      --card: #f7f7f8;
      --border: #e5e7eb;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --bg: #0b0c0f;
        --card: #16181d;
        --border: #23262d;
        --accent: #7aa2ff;
      }
    }
    html, body {
      margin: 0;
      padding: 0;
      font: 14px -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background: var(--bg);
    }
    .card {
      margin: 16px;
      padding: 20px 22px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    h1 { margin: 0 0 6px; font-size: 18px; }
    p { margin: 0; color: var(--muted); font-size: 13px; }
    .meta { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
            color: var(--muted); font-size: 11px; }
    .accent { color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, <span id="name" class="accent">world</span> 👋</h1>
    <p>This is the simplest possible MCP App — static HTML, no scripts beyond the protocol shim.</p>
    <div class="meta">
      Resource <code>ui://hello</code> · MIME <code>text/html;profile=mcp-app</code> · Rendered <span id="ts">just now</span>
    </div>
  </div>

  <script>
    // SEP-1865 init handshake + tool-input listener.
    let nextId = 1;
    const pending = new Map();

    function send(msg) { parent.postMessage(msg, "*"); }
    function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }
    function request(method, params) {
      const id = nextId++;
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject });
        send({ jsonrpc: "2.0", id, method, params });
      });
    }

    window.addEventListener("message", (e) => {
      const m = e.data;
      if (!m || m.jsonrpc !== "2.0") return;
      if ("result" in m || "error" in m) {
        const p = pending.get(m.id);
        if (p) { pending.delete(m.id); m.error ? p.reject(m.error) : p.resolve(m.result); }
        return;
      }
      if (m.method === "ui/notifications/tool-input" || m.method === "ui/notifications/tool-input-partial") {
        const args = (m.params && m.params.arguments) || {};
        if (args.name) document.getElementById("name").textContent = args.name;
        document.getElementById("ts").textContent = new Date().toLocaleTimeString();
      }
    });

    request("ui/initialize", {
      protocolVersion: "2025-06-18",
      clientInfo: { name: "hello-widget", version: "1.0.0" },
      appCapabilities: {},
    }).then(() => notify("ui/notifications/initialized", {}));
  </script>
</body>
</html>
